name: dingdong_mobile
description: DingDong Android companion.
publish_to: none
version: 0.2.0+2

environment:
  sdk: ^3.12.2

dependencies:
  connectivity_plus: ^7.3.1
  dingdong_link_protocol:
    path: ../packages/dingdong_link_protocol
  file_picker: ^10.3.3
  flutter:
    sdk: flutter
  flutter_foreground_task: ^11.0.3
  flutter_local_notifications: ^22.3.2
  path_provider: ^2.1.5

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/symbols/
