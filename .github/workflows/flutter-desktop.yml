name: Flutter desktop

on:
  pull_request:
  push:
    branches:
      - main
      - "codex/**"

permissions:
  contents: read

jobs:
  device-link-web:
    name: device-link-web
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: device_link_relay/package-lock.json
      - name: Install relay dependencies
        working-directory: device_link_relay
        run: npm ci
      - name: Test the PWA and relay contracts
        working-directory: device_link_relay
        run: npm run check
      - name: Verify the Cloudflare Worker bundle
        working-directory: device_link_relay
        run: npx wrangler deploy --dry-run

  macos-mcp:
    name: macos-mcp-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
          - arch: x86_64
            runner: macos-15-intel
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version: 3.44.6
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Build and test native MCP
        run: |
          chmod +x scripts/build_macos_mcp.sh
          scripts/build_macos_mcp.sh "build/mcp-${{ matrix.arch }}" "${{ matrix.arch }}"
      - uses: actions/upload-artifact@v4
        with:
          name: mcp-macos-${{ matrix.arch }}
          path: build/mcp-${{ matrix.arch }}/bundle/
          if-no-files-found: error

  macos-mcp-universal:
    needs: macos-mcp
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          name: mcp-macos-arm64
          path: ${{ runner.temp }}/mcp-arm64
      - uses: actions/download-artifact@v4
        with:
          name: mcp-macos-x86_64
          path: ${{ runner.temp }}/mcp-x86_64
      - name: Create and test dual-architecture MCP
        run: |
          chmod +x scripts/create_universal_macos_mcp.sh
          scripts/create_universal_macos_mcp.sh \
            "$RUNNER_TEMP/mcp-arm64" \
            "$RUNNER_TEMP/mcp-x86_64" \
            "$RUNNER_TEMP/mcp-universal"
          smoke_output="$RUNNER_TEMP/mcp-universal-tools-list.json"
          printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"tools/list","params":{}}' \
            | "$RUNNER_TEMP/mcp-universal/bin/dingdong_mcp" \
            > "$smoke_output"
          if ! grep -q '"result"' "$smoke_output" \
            || ! grep -q '"tools"' "$smoke_output"; then
            cat "$smoke_output"
            exit 1
          fi

  macos:
    name: macos-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
          - arch: x86_64
            runner: macos-15-intel
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version: 3.44.6
          channel: stable
          cache: true
      - run: flutter config --enable-macos-desktop
      - run: flutter pub get
      - run: flutter analyze
      - name: Test the native selection host
        run: xcrun swift test --package-path macos/Runner/SelectionPlugin
      - name: Run tests with visual goldens
        if: matrix.arch == 'arm64'
        run: flutter test
      - name: Run tests without architecture-specific visual goldens
        if: matrix.arch == 'x86_64'
        run: flutter test --exclude-tags golden
      - name: Save actual golden images for review
        if: failure() && matrix.arch == 'arm64'
        uses: actions/upload-artifact@v4
        with:
          name: DingDong-golden-actual-arm64
          path: test/**/failures/*_testImage.png
          retention-days: 7
          if-no-files-found: ignore
      - run: flutter build macos --debug
      - name: Verify macOS thinning contract
        run: |
          chmod +x scripts/thin_macos_app.sh
          scripts/thin_macos_app.sh \
            "build/macos/Build/Products/Debug/DingDong DEV.app" \
            "${{ matrix.arch }}"
      - name: Verify macOS application architecture
        run: |
          app_binary="build/macos/Build/Products/Debug/DingDong DEV.app/Contents/MacOS/DingDong DEV"
          description="$(/usr/bin/file -b "$app_binary")"
          printf '%s\n' "$description"
          architectures="$(/usr/bin/lipo -archs "$app_binary")"
          test "$architectures" = "${{ matrix.arch }}"

  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version: 3.44.6
          channel: stable
          cache: true
      - run: flutter config --enable-windows-desktop
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test --exclude-tags golden
      - run: flutter build windows --debug
      - name: Build Windows release preview
        run: flutter build windows --release --no-pub
      - name: Install pinned Velopack packager
        shell: pwsh
        run: dotnet tool install --tool-path .tools vpk --version 1.2.0
      - name: Package Windows preview installer
        shell: pwsh
        run: |
          $versionLine = Get-Content -LiteralPath pubspec.yaml |
            Where-Object { $_ -match '^version:\s*\S+\s*$' } |
            Select-Object -First 1
          if ($null -eq $versionLine) {
            throw "pubspec.yaml does not contain an application version."
          }
          $version = ($versionLine -replace '^version:\s*', '').Trim().Split('+')[0]
          if ($version -notmatch '^\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$') {
            throw "Invalid application package version: $version"
          }
          $packDir = "build/windows/x64/runner/Release"
          $developmentMarkers = Get-ChildItem -LiteralPath $packDir -Recurse `
            -File -Filter "dingdong-development.marker"
          if ($developmentMarkers) {
            throw "A preview installer must use the standard DingDong data directory."
          }
          $previewNotes = Join-Path $env:RUNNER_TEMP "dingdong-windows-preview-notes.md"
          $previewNotesContent = @(
            "# DingDong $version Windows CI preview"
            ""
            "Development preview from commit $env:GITHUB_SHA, delivered only as a CI artifact."
            "This is not an official public release."
            "It uses the standard DingDong application identity and local data directory."
            "Back up existing DingDong data before installing this preview."
          ) -join "`n"
          Set-Content -LiteralPath $previewNotes -Value $previewNotesContent -Encoding utf8
          New-Item -ItemType Directory -Force -Path build/windows-preview | Out-Null
          .\.tools\vpk.exe pack `
            --packId "JevonsCode.DingDong" `
            --packVersion $version `
            --packDir $packDir `
            --mainExe "DingDong.exe" `
            --packTitle "DingDong" `
            --packAuthors "JevonsCode" `
            --releaseNotes $previewNotes `
            --icon "windows/runner/resources/app_icon.ico" `
            --runtime "win-x64" `
            --channel "win" `
            --noPortable `
            --outputDir "build/windows-preview"
          if ($LASTEXITCODE -ne 0) {
            throw "Velopack preview packaging failed with exit code $LASTEXITCODE."
          }
          $setup = Get-ChildItem -Path build/windows-preview -Filter "*-Setup.exe" |
            Select-Object -First 1
          if ($null -eq $setup) {
            throw "Velopack did not create a preview Setup executable."
          }
          Copy-Item -LiteralPath $setup.FullName `
            "build/windows-preview/DingDong-${version}-windows-x64-Setup.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: DingDong-windows-preview
          path: build/windows-preview/*
          retention-days: 7
          if-no-files-found: error
