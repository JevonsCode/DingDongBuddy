name: Device link Cloudflare

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: device-link-cloudflare-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    environment: device-link-production
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: device_link_relay/package-lock.json
      - name: Install and test
        working-directory: device_link_relay
        run: |
          npm ci
          npm run check
          npx wrangler deploy --dry-run
      - name: Deploy the Worker and PWA
        working-directory: device_link_relay
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler d1 migrations apply dingdong-lifecycle-telemetry --remote
          npx wrangler deploy --var DINGDONG_RELEASE_SHA:${{ github.sha }}
      - name: Verify the production deployment
        shell: bash
        run: |
          origin="https://dingdong.xn--m8txu.com"
          version="$(sed -n 's/^version: \([^+]*\).*/\1/p' pubspec.yaml)"
          health="$(curl --fail --silent --show-error "$origin/v1/health")"
          config="$(curl --fail --silent --show-error "$origin/v1/config")"
          deployed_version="$(printf '%s' "$health" | node -e 'let body=""; process.stdin.on("data", chunk => body += chunk); process.stdin.on("end", () => process.stdout.write(JSON.parse(body).serviceVersion || ""));')"
          deployed_sha="$(printf '%s' "$health" | node -e 'let body=""; process.stdin.on("data", chunk => body += chunk); process.stdin.on("end", () => process.stdout.write(JSON.parse(body).releaseSha || ""));')"
          push_available="$(printf '%s' "$config" | node -e 'let body=""; process.stdin.on("data", chunk => body += chunk); process.stdin.on("end", () => process.stdout.write(String(JSON.parse(body).pushAvailable === true)));')"
          lifecycle_telemetry_available="$(printf '%s' "$config" | node -e 'let body=""; process.stdin.on("data", chunk => body += chunk); process.stdin.on("end", () => process.stdout.write(String(JSON.parse(body).lifecycleTelemetryAvailable === true)));')"
          test "$deployed_version" = "$version"
          test "$deployed_sha" = "$GITHUB_SHA"
          test "$push_available" = "true"
          test "$lifecycle_telemetry_available" = "true"

          temporary_file="$(mktemp)"
          trap 'rm -f "$temporary_file"' EXIT
          while IFS= read -r repo_path; do
            remote_path="${repo_path#docs}"
            curl --fail --silent --show-error --location "$origin$remote_path" -o "$temporary_file"
            expected_hash="$(sha256sum "$repo_path" | awk '{print $1}')"
            actual_hash="$(sha256sum "$temporary_file" | awk '{print $1}')"
            test "$actual_hash" = "$expected_hash"
          done < <(
            {
              git ls-files docs/app/
              sed -n 's|^!/|docs/|p' docs/.assetsignore | while IFS= read -r candidate; do
                if [ -f "$candidate" ]; then
                  printf '%s\n' "$candidate"
                fi
              done
            } | sort -u
          )

          curl --fail --silent --show-error \
            --dump-header "$temporary_file" \
            --output /dev/null \
            "$origin/app/"
          grep -qi '^content-security-policy:' "$temporary_file"
          grep -qi '^strict-transport-security:' "$temporary_file"
          grep -qi '^x-content-type-options: *nosniff' "$temporary_file"
