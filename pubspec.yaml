name: dingdong
description: Cross-platform desktop companion for local AI agents.
publish_to: none
version: 1.11.2+85

environment:
  sdk: ^3.12.2

dependencies:
  agent_installer:
    git:
      url: https://github.com/JevonsCode/agent-installer.git
      ref: 9b3c9fb7e92e9e4c9dd5bf9c0e1ac4300704a033
  agent_session_launcher:
    git:
      url: https://github.com/JevonsCode/agent-session-launcher.git
      ref: dce8ab5bb68c750f52bb9b0409e8ac7cc52f544a
  characters: ^1.4.1
  cryptography: ^2.9.0
  desktop_multi_window:
    path: packages/desktop_multi_window
  dingdong_link_protocol:
    path: packages/dingdong_link_protocol
  file_selector: ^1.1.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_secure_storage: ^11.2.0
  flutter_webrtc: ^1.6.0
  intl: ^0.20.2
  pasteboard: ^0.5.0
  path: ^1.9.1
  qr_flutter: ^4.1.0
  screen_retriever: ^0.2.2
  shared_preferences: ^2.5.5
  sqlite3: ^3.3.4
  tray_manager:
    path: packages/tray_manager
  url_launcher: ^6.3.2
  window_manager:
    path: packages/window_manager
  yaml: ^3.1.3

dev_dependencies:
  crypto: ^3.0.7
  fake_async: ^1.3.3
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

flutter:
  generate: true
  uses-material-design: true
  assets:
    - third_party/selection-hook/LICENSE
    - Assets/
    - Assets/DingDongIP/
    - Assets/Sounds/
    - Assets/Symbols/
    - Assets/Agent Adapters/
    - Assets/Agent Integrations/
    - skills/dingdong-configure/
    - windows/runner/resources/app_icon.ico
    - windows/runner/resources/tray_icon_adaptive_unread.ico
    - windows/runner/resources/tray_icon_adaptive_unread2.ico
    - windows/runner/resources/tray_icon_on_dark.ico
    - windows/runner/resources/tray_icon_on_dark_rest.ico
    - windows/runner/resources/tray_icon_on_dark_rest2.ico
    - windows/runner/resources/tray_icon_on_dark_sleeping.ico
    - windows/runner/resources/tray_icon_on_dark_sleeping2.ico
    - windows/runner/resources/tray_icon_on_dark_unread.ico
    - windows/runner/resources/tray_icon_on_dark_unread2.ico
    - windows/runner/resources/tray_icon_on_light.ico
    - windows/runner/resources/tray_icon_on_light_rest.ico
    - windows/runner/resources/tray_icon_on_light_rest2.ico
    - windows/runner/resources/tray_icon_on_light_sleeping.ico
    - windows/runner/resources/tray_icon_on_light_sleeping2.ico
    - windows/runner/resources/tray_icon_on_light_unread.ico
    - windows/runner/resources/tray_icon_on_light_unread2.ico
